<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Farid Enrique Jimenez Campo — Convierto datos e IA en decisiones inteligentes">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#15233B"/>
    </linearGradient>

    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#fondo)"/>
  <rect width="1200" height="300" fill="url(#rejilla)"/>
  <ellipse cx="960" cy="70" rx="380" ry="240" fill="url(#halo)"/>

  <!-- dato -> decision: tres nodos que se encienden en secuencia -->
  <g transform="translate(980,208)">
    <line x1="0" y1="0" x2="150" y2="0" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#38BDF8">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="75" cy="0" r="5" fill="#818CF8">
      <animate attributeName="r" values="4;7;4" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.45;1;0.45" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="0" r="5" fill="#34D399">
      <animate attributeName="r" values="4;7;4" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.45;1;0.45" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="26" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#64748B">dato</text>
    <text x="150" y="26" text-anchor="end" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="12" fill="#64748B">decisión</text>
  </g>

  <g font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="80" y="112" font-size="52" font-weight="700" fill="#F8FAFC" letter-spacing="-0.5">Farid Enrique Jiménez Campo</text>

    <rect x="80" y="136" width="132" height="3" rx="1.5" fill="url(#acento)"/>
    <rect x="80" y="136" width="132" height="3" rx="1.5" fill="url(#brillo)">
      <animate attributeName="x" values="80;1020;80" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="80" y="184" font-size="26" font-weight="600" fill="#38BDF8">Convierto datos e IA en decisiones inteligentes</text>
    <text x="80" y="216" font-size="16" font-style="italic" fill="#94A3B8">I turn data and AI into intelligent decisions</text>

    <text x="80" y="256" font-size="15" font-weight="600" fill="#CBD5E1" letter-spacing="2.5">AI ENGINEER · DATA SCIENTIST · FULL STACK</text>
    <text x="80" y="278" font-size="13" fill="#64748B">Barranquilla, Colombia — construyendo desde LATAM para el mundo</text>
  </g>

  <rect x="0" y="296" width="1200" height="4" fill="url(#acento)"/>
</svg>
